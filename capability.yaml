name: elementeer-mcp
version: 2.1.0
kind: mcp-server
owner: elementeer
license: Apache-2.0
description: >
  AI-native MCP server for Elementor providing 250+ tools for site management,
  page building, content orchestration, add-on analytics, design system management,
  and framework-level workflow automation.
homepage: https://github.com/elementeer/elementeer-mcp
repository: https://github.com/elementeer/elementeer-mcp
entrypoint: mcp-server
mcp:
  transport: stdio
  command: node
  args:
    - mcp-server/dist/index.js
runtimes:
  node: ">=22"
capabilities:
  - site-audit
  - stack-bootstrap
  - site-foundation
  - design-system
  - content-structure
  - theme-structure
  - library-operations
  - media-operations
  - plugin-stack-context
  - governance
  - ally
  - translate
  - lms
  - charity
  - booking
  - voxel
  - diagnostics
  - workflow-orchestration
  - site-settings
  - seo-operations
  - performance-operations
  - ecommerce-operations
tags:
  - elementor
  - wordpress
  - page-builder
  - mcp
  - ai
  - site-management
