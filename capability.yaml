name: elementeer-mcp
version: 2.4.1
kind: mcp-server
owner: elementeer
license: Apache-2.0
description: >
  AI-native MCP server for Elementor providing 250+ tools for site management,
  page building, content orchestration, add-on analytics, design system management,
  and framework-level workflow automation.
homepage: https://git.langevc.com/elementeer/elementeer-mcp
repository: https://git.langevc.com/elementeer/elementeer-mcp
frameworks:
  - opencode
  - claude-code
  - claude-desktop
  - qwen
  - gemini-cli
  - cursor
  - codex
entrypoint: mcp-server
runtimes:
  node: ">=22"
capabilities:
  - site-audit
  - stack-bootstrap
  - site-foundation
  - design-system
  - content-structure
  - theme-structure
  - library-operations
  - media-operations
  - plugin-stack-context
  - governance
  - ally
  - translate
  - lms
  - charity
  - booking
  - voxel
  - diagnostics
  - workflow-orchestration
  - site-settings
  - seo-operations
  - performance-operations
  - ecommerce-operations
discovery:
  deferred_tools: true
  tool_surface_prompt: >
    Elementeer MCP provides 250+ AI-native tools for WordPress and Elementor site management,
    including site auditing, page building, content orchestration, design system management,
    add-on analytics, SEO operations, performance optimization, e-commerce operations,
    accessibility scanning, translation management, and governed workflow automation.
  auto_discover: true
tags:
  - elementor
  - wordpress
  - page-builder
  - mcp
  - ai
  - site-management
