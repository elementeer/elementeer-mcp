name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  pre-build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Prepare plugin mirror
        run: node scripts/prepare-plugin-mirror.mjs
      - name: Pre-build quality gate
        run: bash scripts/release-check.sh --pre-build

  post-build:
    needs: pre-build
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Build MCP server
        run: |
          cd mcp-server && npm run build
      - name: Post-build quality gate
        run: bash scripts/release-check.sh --post-build
      - name: Package MCP server
        run: |
          cd mcp-server
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/release
          cd dist
          tar czf /tmp/release/elementeer-mcp-v$VERSION.tgz .
          echo "TGZ=/tmp/release/elementeer-mcp-v$VERSION.tgz" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Create Release
        run: |
          TAG="${GITHUB_REF##*/}"
          curl -X POST "https://git.langevc.com/api/v1/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"$TAG\",
              \"name\": \"Elementeer MCP Server v$VERSION\",
              \"body\": \"Release v$VERSION — Voxel Marketplace Wizard tool, 7 read-only Voxel discovery tools.\n\n### Changes\n\`\`\`\n$(git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --oneline 2>/dev/null || echo 'Initial release')\n\`\`\`\"
            }" > /tmp/release-response.json
          RELEASE_ID=$(jq -r '.id' /tmp/release-response.json)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
      - name: Install curl/jq for asset upload
        run: |
          apk add --no-cache curl jq 2>/dev/null || apt-get update -qq && apt-get install -y -qq curl jq
      - name: Upload Release Asset
        run: |
          TGZNAME="elementeer-mcp-v$VERSION.tgz"
          curl -X POST "https://git.langevc.com/api/v1/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$TGZ" \
            -H "name=$TGZNAME"
          echo "Asset uploaded: $TGZNAME"
