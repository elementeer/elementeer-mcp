name: Release
on:
  push:
    tags:
      - 'v*'
  create:
    tags:
      - 'v*'

jobs:
  pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install checkout deps
        run: apk add --no-cache nodejs npm git bash curl jq
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Prepare plugin mirror
        run: node scripts/prepare-plugin-mirror.mjs
      - name: Pre-build quality gate
        run: bash scripts/release-check.sh --pre-build

  post-build:
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      - name: Install checkout deps
        run: apk add --no-cache nodejs npm git bash curl jq
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Build MCP server
        run: |
          cd mcp-server && npm run build
      - name: Post-build quality gate
        run: bash scripts/release-check.sh --post-build
      - name: Package MCP server
        run: |
          cd mcp-server
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/release
          cd dist
          tar czf /tmp/release/elementeer-mcp-v$VERSION.tgz .
          echo "TGZ=/tmp/release/elementeer-mcp-v$VERSION.tgz" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      - name: Create Forgejo Release
        run: |
          TAG="${GITHUB_REF##*/}"
          curl -X POST "https://git.langevc.com/api/v1/repos/$GITHUB_REPOSITORY/releases" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg tag "$TAG" --arg name "Elementeer MCP Server v$VERSION" --arg body "Release v$VERSION.

### Changes
$(git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo 'HEAD^')..HEAD --oneline 2>/dev/null || echo 'Initial release')" '{tag_name: $tag, name: $name, body: $body}')" \
            > /tmp/release-response.json
          RELEASE_ID=$(jq -r '.id' /tmp/release-response.json)
          echo "RELEASE_ID=$RELEASE_ID" >> $GITHUB_ENV
      - name: Upload Release Asset
        run: |
          TGZNAME="elementeer-mcp-v$VERSION.tgz"
          curl -X POST "https://git.langevc.com/api/v1/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$TGZNAME" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$TGZ"
          echo "Asset uploaded: $TGZNAME"
      - name: Mirror Release to GitHub
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" \
            --repo elementeer/elementeer-mcp \
            --title "Elementeer MCP Server v$VERSION" \
            --notes "Release v$VERSION." \
            "$TGZ#Elementeer MCP Server v$VERSION" \
            || echo "Mirror release skipped (token may lack permissions)"
