name: Release
on:
  push:
    tags:
      - 'v*'
  create:
    tags:
      - 'v*'

jobs:
  pre-build:
    runs-on: ubuntu-latest
    steps:
      - name: Install checkout deps
        run: apk add --no-cache nodejs npm git bash curl jq
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Pre-build quality gate
        run: bash scripts/release-check.sh --pre-build

  post-build:
    needs: pre-build
    runs-on: ubuntu-latest
    steps:
      - name: Install checkout deps
        run: apk add --no-cache nodejs npm git bash curl jq
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          cd mcp-server && npm ci
      - name: Build MCP server
        run: |
          cd mcp-server && npm run build
      - name: Post-build quality gate
        run: bash scripts/release-check.sh --post-build
      - name: Package MCP server
        run: |
          cd mcp-server
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p /tmp/release
          cd dist
          tar czf /tmp/release/elementeer-mcp-v$VERSION.tgz .
          echo "TGZ=/tmp/release/elementeer-mcp-v$VERSION.tgz" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # The release object is not created here. The ops-engine ReleaseHandler
      # publishes it on tag_push from .ops.yaml (destinations forgejo and
      # github) and attaches the .tgz it collects (RFL-004 marks the asset
      # "engine takes over"). This workflow keeps the two quality gates and the
      # packaging.
