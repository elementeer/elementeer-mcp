# Layer-3 repository override (DST-002): the release destinations for
# elementeer-mcp. The forge is a value, not a key name (DST-001). The engine
# reads this file via config_loader.load_ops_yaml and resolves BOTH destinations
# from it; no destination, forge repository, host or credential name is
# restated as a literal in .forgejo/.
#
# Visibilities are the MEASURED state of each forge on 2026-11-16, not an
# inference from the mirror declaration in elementeer-ops/config.yml:
#   - canonical Forgejo elementeer/elementeer-mcp: PRIVATE.
#     GET /api/v1/repos/elementeer/elementeer-mcp (authenticated) answers
#     {"private": true, "internal": false}; an anonymous request answers 403,
#     as it does for the known-private fusionaize/faigrid.
#   - GitHub mirror elementeer/elementeer-mcp: PUBLIC.
#     GET https://api.github.com/repos/elementeer/elementeer-mcp answers
#     {"private": false, "visibility": "public"}.
#
# This file restores the public distribution that D37 (owner decision
# 2026-11-04, LVC-303) switched off in elementeer-ops/config.yml and that
# RFL-014 re-declares there with its candidate globs and the accepted
# (path, blob) exception. The two declarations have different roles and are not
# duplicates: the Layer-2 entry is the `mirror` destination the visibility gate
# judges and the layover pushes; these entries are the `release` destinations
# publish_release writes, the only role _release_tag resolves with.
destinations:
  - forge: forgejo
    repo: elementeer/elementeer-mcp
    role: release
    visibility: private
    credential_variable: FORGEJO_TOKEN
  - forge: github
    repo: elementeer/elementeer-mcp
    role: release
    visibility: public
    credential_variable: GH_MIRROR_TOKEN

# The organisation's canonical forge host (REL-023). The release gate reads it
# from here and hands it to the destination/host boundary gate, so a hardcoded
# canonical host in a workflow is refused rather than a runner-internal
# container address (github.server_url resolves to http://forgejo:3000 on the
# runner, which is not the organisation's forge). A dotless entry is refused by
# name. Keep the declaration on exactly one line: the extractor reads a single
# `forge_hosts:` line.
forge_hosts: [git.langevc.com]

# The release block, declared whole: the layer-3 merge replaces this model
# field as a value, so every sub-key it needs is restated here rather than
# inherited from a layer-2 default (EP-006, RFL-004).
#
# The asset name is read from the packaging step in
# .forgejo/workflows/release.yml, not guessed:
#   tar czf /tmp/release/elementeer-mcp-v$VERSION.tgz .
# with VERSION from mcp-server/package.json. That file is exactly the one
# in the directory release_attach is handed, so the declaration only fills
# in the tag-derived version: <version> is substituted with the tag without
# its leading "v" (v2.4.3 -> 2.4.3), giving elementeer-mcp-v2.4.3.tgz.
#
# `type` is the form of the file, not its extension. The engine's release
# types are github_release_zip for a release-object file and
# github_release_tarball for a plain text file the release carries (the fleet
# reading: a .tar.gz sdist is declared github_release_zip, SHA256SUMS is
# declared github_release_tarball). The .tgz is a gzipped tar attached as a
# release-object file, so its type is github_release_zip.
release:
  enabled: true
  trigger: tag_push
  tag_pattern: "v*"
  name_template: "Elementeer MCP {tag_name}"
  assets:
    - type: github_release_zip
      name: "elementeer-mcp-v<version>.tgz"

# Deliberately NOT declared here:
#   - tracker_prefixes: the engine's audience gate refuses nothing when the
#     list is empty, which is the documented default. This repository's history
#     names ELM-<KIND> ids, but the release body is sliced from CHANGELOG.md, so
#     the vocabulary that gate should refuse is a business decision for the
#     owner, not a value to copy from elementeer-ops' layover-level
#     `ticket_prefixes` (a different gate, read by src/config_parser.py).
#   - release_body_install_block / release_body_assets_line: per-repository
#     business data (P36-017). Empty means the body carries no Install section
#     and no assets line rather than an engine default.
#   - visibility_candidate_globs / visibility_exceptions: the Layer-2 entry in
#     elementeer-ops/config.yml owns them; a Layer-3 list would REPLACE that
#     list on merge, and the globs must cover the mirror destination the gate
#     judges.
