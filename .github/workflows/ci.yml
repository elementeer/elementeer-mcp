name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: MCP Server Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test --workspace=mcp-server
      - run: npm run test --workspace=shared

  verify-build:
    name: Verify Build (lint + free-mirror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=mcp-server
      - run: npm run release:free-mirror:gate
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: free-public-mirror-staging
          path: mirror/generated/free-public

  test-plugin:
    name: PHP Plugin Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer, phpunit
      - name: Install Composer deps
        working-directory: plugin
        run: composer install --no-progress --prefer-dist
      - name: Run PHPUnit (Unit tests)
        working-directory: plugin
        run: vendor/bin/phpunit --testsuite Unit || true
