name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: MCP Server Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test --workspace=mcp-server || true
      - run: npm run test --workspace=shared || true

  verify-build:
    name: Verify Build (lint + free-mirror)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint --workspace=mcp-server
      - run: npm run release:free-mirror:gate
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: free-public-mirror-staging
          path: mirror/generated/free-public
