name: Release
#
# CONVENTIONS (must-follow):
#   • Tag format:          vX.Y.Z  (semantic version, e.g. v2.0.3)
#   • Release title:       Elementeer vX.Y.Z
#   • Branch naming:       release/X.Y.Z-{descriptor}  (e.g. release/2.0.3-hotfix)
#   • Plugin ZIP:          elementeer.X.Y.Z.zip
#   • Release description: free-form, keep title clean
#
on:
  push:
    tags:
      - 'v*'

jobs:
  npm-publish:
    name: Publish @elementeer/mcp to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Publish to npm (skipped if NPM_TOKEN not set)
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not configured — skipping publish."
            exit 0
          fi
          npm publish --workspace=mcp-server --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  plugin-zip:
    name: Build WordPress Plugin ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Plugin ZIPs are built in elementeer/elementeer and elementeer/elementeer-pro repos
        run: |
          echo "Plugin ZIP builds moved to elementeer/elementeer and elementeer/elementeer-pro repositories."
          echo "This job is now a no-op for elementeer-mcp."

  publish-dry-run:
    name: Publish Dry Run (non-tag)
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm publish --workspace=mcp-server --dry-run
